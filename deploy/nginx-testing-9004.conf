# Install this server block in the test server's Nginx configuration.
# The certificate paths must match the certificate issued for shualian.chbzg.com.cn.
server {
    listen 9004 ssl;
    listen [::]:9004 ssl;
    server_name shualian.chbzg.com.cn;

    ssl_certificate /etc/letsencrypt/live/shualian.chbzg.com.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shualian.chbzg.com.cn/privkey.pem;

    client_max_body_size 12m;

    location / {
        proxy_pass http://127.0.0.1:19004;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
