name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Python checks
        run: |
          PYTHONPYCACHEPREFIX=/tmp/face-verify-demo-pycache python -m py_compile backend/app/*.py tests/test_verification_guards.py
          PYTHONPYCACHEPREFIX=/tmp/face-verify-demo-pycache python -m unittest discover -s tests -v

      - name: Run frontend static checks
        run: |
          node --check backend/static/app.js
          node scripts/test_frontend_static.js
